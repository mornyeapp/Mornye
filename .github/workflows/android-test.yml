name: Android Test Build

# Quick Android-only test build. Unlike Release, this never creates a
# GitHub release and builds no other platform. The APKs get the package
# name com.zarz.mornye.test and the launcher label "Mornye Test", so they
# install next to the normal Mornye app instead of replacing it, with
# their own separate app data.
#
# The build is Lite (no Discord SDK) and signed with the debug key that
# Gradle falls back to when no key.properties exists, so it needs no
# repository secrets and can be installed directly for testing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    env:
      MORNYE_DISCORD_SDK: "0"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Rust binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-public-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-public-dependencies-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # Only this workflow's checkout is patched; the committed files keep
      # the real package name. The namespace stays com.zarz.mornye, and the
      # manifest providers already use ${applicationId}, so they follow
      # the new package name automatically.
      - name: Patch package name and label for the test build
        run: |
          set -euo pipefail
          sed -i 's/applicationId = "com.zarz.mornye"/applicationId = "com.zarz.mornye.test"/' \
            android/app/build.gradle.kts
          sed -i 's/android:label="Mornye"/android:label="Mornye Test"/' \
            android/app/src/main/AndroidManifest.xml

          grep -q 'applicationId = "com.zarz.mornye.test"' android/app/build.gradle.kts || {
            echo "ERROR: applicationId patch did not apply" >&2
            exit 1
          }
          grep -q 'android:label="Mornye Test"' android/app/src/main/AndroidManifest.xml || {
            echo "ERROR: app label patch did not apply" >&2
            exit 1
          }

      - name: Build test APKs (arm64 and arm32)
        run: |
          bash scripts/build_android.sh --lite --target lib/main.dart
          ls -la build/app/outputs/flutter-apk/

      - name: Verify and collect test APKs
        run: |
          set -euo pipefail
          apk_dir=build/app/outputs/flutter-apk
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"

          mkdir -p test-apks
          cp "$apk_dir/app-arm64-v8a-release.apk" test-apks/Mornye-Test-arm64.apk
          cp "$apk_dir/app-armeabi-v7a-release.apk" test-apks/Mornye-Test-arm32.apk

          for apk in test-apks/Mornye-Test-arm64.apk test-apks/Mornye-Test-arm32.apk; do
            package="$("$aapt2" dump packagename "$apk")"
            if [ "$package" != "com.zarz.mornye.test" ]; then
              echo "ERROR: $apk has package $package, expected com.zarz.mornye.test" >&2
              exit 1
            fi
            "$aapt2" dump badging "$apk" | grep -E "^package:|^application-label:"
          done

          (cd test-apks && sha256sum Mornye-Test-*.apk > SHA256SUMS.txt)

      - name: Upload test APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-apk
          if-no-files-found: error
          retention-days: 14
          path: |
            test-apks/Mornye-Test-*.apk
            test-apks/SHA256SUMS.txt
