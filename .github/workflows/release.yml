name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

          # Check if version contains -preview, -beta, -rc, or -alpha (NOT -hotfix)
          VERSION_LOWER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          if [[ "$VERSION_LOWER" == *"-preview"* ]] || [[ "$VERSION_LOWER" == *"-beta"* ]] || [[ "$VERSION_LOWER" == *"-rc"* ]] || [[ "$VERSION_LOWER" == *"-alpha"* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Detected pre-release version: $VERSION"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Detected stable version: $VERSION"
          fi

  build-android:
    runs-on: ubuntu-latest
    needs: get-version
    env:
      MORNYE_DISCORD_SDK: "1"

    steps:
      - name: Free disk space
        run: |
          # Remove large unused tools (~15GB total). Docker prune was dropped:
          # it took 1-2 minutes and the rm below already frees enough.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          df -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Discord SDK
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Install Rust binding generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          # Do not publish transforms of the decrypted SDK in shared caches.
          key: gradle-public-dependencies-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-public-dependencies-${{ runner.os }}-

      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.16248370
          key: ndk-30.0.16248370

      - name: Install Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          # Install NDK r30 (supports 16KB page size for Android 15+)
          # Keep the installed platform aligned with compileSdk/targetSdk.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.16248370" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "cmake;4.1.2"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build release APKs
        run: |
          bash scripts/build_android.sh --production --target lib/main.dart
          ls -la build/app/outputs/flutter-apk/

      - name: Sign and verify release APKs (V1/V2/V3/V4)
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/mornye-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk_dir=build/app/outputs/flutter-apk

          for target in arm64-v8a:arm64 armeabi-v7a:arm32; do
            abi="${target%%:*}"
            label="${target##*:}"
            apk="$apk_dir/Mornye-${VERSION}-${label}.apk"
            "$apksigner" sign \
              --ks "$signing_dir/release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled true \
              --out "$apk" "$apk_dir/app-${abi}-release.apk"

            # V4 is written beside the APK as "$apk.idsig" for incremental
            # ADB installs; normal installers keep using V1-V3 inside the APK.
            if [ ! -s "$apk.idsig" ]; then
              echo "ERROR: APK signature V4 file was not created: $apk.idsig" >&2
              exit 1
            fi

            # Verify the app's supported Android versions, then explicitly
            # exercise V1 too: the manifest's minSdk 24 normally skips it.
            "$apksigner" verify "$apk"
            report="$("$apksigner" verify --verbose --print-certs --min-sdk-version 21 \
              --v4-signature-file "$apk.idsig" "$apk")"
            for scheme in 1 2 3 4; do
              if ! grep -Eq "Verified using v${scheme} scheme.*: true" <<< "$report"; then
                echo "ERROR: APK signature V${scheme} did not verify: $apk" >&2
                exit 1
              fi
            done
            if grep -qi "Android Debug" <<< "$report"; then
              echo "ERROR: Refusing to publish a debug-signed APK" >&2
              exit 1
            fi
            printf '%s\n' "$report" | grep -E '^Verifies$|^Verified using v[1234] scheme|certificate SHA-256 digest:'
          done

      - name: Audit signed Rust APKs before upload
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_check_backend_apk.py'
          apk_dir=build/app/outputs/flutter-apk
          python3 scripts/check_backend_apk.py "$apk_dir/Mornye-${VERSION}-arm64.apk" \
            --backend rust --abis arm64-v8a --discord-sdk
          python3 scripts/check_backend_apk.py "$apk_dir/Mornye-${VERSION}-arm32.apk" \
            --backend rust --abis armeabi-v7a --discord-sdk
          for abi in arm64 arm32; do
            "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 \
              "$apk_dir/Mornye-${VERSION}-${abi}.apk"
          done
          (cd "$apk_dir" && sha256sum Mornye-*.apk > SHA256SUMS.txt)

      - name: Record Android symbol provenance
        run: |
          test -s build/symbols/android/app.android-arm64.symbols
          test -s build/symbols/android/app.android-arm.symbols
          test -s build/app/outputs/mapping/release/mapping.txt
          git rev-parse HEAD > build/symbols/android/commit.txt
          sha256sum build/app/outputs/flutter-apk/Mornye-*.apk > build/symbols/android/apk-sha256.txt

      - name: Retain Android debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-symbols-${{ needs.get-version.outputs.version }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/symbols/android/
            build/app/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/Mornye-*.apk
            build/app/outputs/flutter-apk/Mornye-*.apk.idsig
            build/app/outputs/flutter-apk/SHA256SUMS.txt

  build-ios:
    runs-on: macos-15
    needs: get-version # Only depends on version, NOT android build!
    env:
      MORNYE_DISCORD_SDK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pinned Discord SDK
        uses: ./.github/actions/discord-sdk
        with:
          passphrase: ${{ secrets.DISCORD_MOBILE_SDK_PASSPHRASE }}

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Build Rust backend for iOS
        run: bash scripts/build_ios.sh

      - name: Cache CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: pods-rust-${{ runner.os }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'rust_backend/MornyeBackend.podspec', 'rust_backend/Cargo.lock') }}
          restore-keys: pods-rust-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      - name: Normalize ffmpeg plugin shell scripts (strip CRLF)
        run: |
          find "$HOME/.pub-cache/hosted" -path "*ffmpeg_kit_flutter_new_audio*/scripts/*.sh" -type f -print0 |
            while IFS= read -r -d '' f; do
              perl -pi -e 's/\r$//' "$f"
              chmod +x "$f"
              echo "Normalized line endings: $f"
            done

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Configure Rust application pods
        working-directory: ios
        run: |
          test -f ../third_party/mornye_discord/ios/Frameworks/discord_partner_sdk.xcframework/Info.plist || {
            echo "Production requires the official Discord SDK. Run scripts/setup_discord_sdk.sh in the build environment first." >&2
            exit 1
          }
          test -f ../third_party/mornye_discord/ios/Frameworks/Discord-License-Notices.txt
          pod install

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign --config-only --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Audit Rust iOS archive before packaging
        run: |
          app="ios/build/Runner.xcarchive/Products/Applications/Runner.app"
          for required in \
            Frameworks/discord_partner_sdk.framework/discord_partner_sdk \
            Frameworks/mornye_discord.framework/Discord-License-Notices.txt; do
            test -s "$app/$required" || {
              echo "Required Discord file missing or empty: $app/$required" >&2
              exit 1
            }
          done
          python3 -m unittest discover -s scripts -p 'test_check_backend_ios.py'
          python3 scripts/check_backend_ios.py \
            ios/build/Runner.xcarchive/Products/Applications/Runner.app \
            --dsym ios/build/Runner.xcarchive/dSYMs/Runner.app.dSYM \
            --backend rust --archs arm64 --platform ios --release

      - name: Create IPA
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p build/ios/ipa
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir Payload
          cp -r Runner.app Payload/
          # Use absolute path to avoid relative path issues
          zip -r "$GITHUB_WORKSPACE/build/ios/ipa/Mornye-${VERSION}-ios-unsigned.ipa" Payload
          rm -rf Payload

      - name: Verify IPA created
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          ls -la build/ios/ipa/
          if [ ! -f "build/ios/ipa/Mornye-${VERSION}-ios-unsigned.ipa" ]; then
            echo "ERROR: IPA not created!"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: build/ios/ipa/Mornye-*.ipa

  # Desktop builds mirror .github/workflows/desktop.yml without its Cargo
  # cache, then package: a universal dmg (ad hoc signed, not notarized),
  # AppImage and deb per Linux architecture, and a Windows installer and
  # portable zip. Each job uploads SHA256SUMS-<target>.txt for create-release.
  build-macos:
    name: Build macOS (universal)
    runs-on: macos-15
    needs: get-version

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.1.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      # The from-source LGPL build only changes with the script, which pins
      # every source archive.
      - name: Cache LGPL FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg/macos-universal
          key: ffmpeg-macos-universal-${{ hashFiles('scripts/fetch_desktop_ffmpeg.sh') }}

      - name: Build LGPL FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_desktop_ffmpeg.sh macos-universal

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # A stable self-signed identity keeps keychain access across updates.
      # Without the secrets the build stays ad hoc signed.
      - name: Set up the signing identity
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          identity="$(bash scripts/setup_macos_signing.sh)"
          echo "MORNYE_CODE_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # The Xcode "Embed Rust Backend" and "Embed FFmpeg" phases embed the
      # library and the FFmpeg tools built above.
      - name: Build macOS app
        env:
          MORNYE_SKIP_RUST_BUILD: "1"
          MORNYE_REQUIRE_FFMPEG: "1"
        run: |
          flutter build macos --release --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

      - name: Package disk image
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          app="build/macos/Build/Products/Release/Mornye.app"
          test -s "$app/Contents/Frameworks/libmornye_desktop.dylib"
          for tool in ffmpeg ffprobe; do
            test -x "$app/Contents/Resources/ffmpeg/$tool"
            for arch in arm64 x86_64; do
              lipo "$app/Contents/Resources/ffmpeg/$tool" -verify_arch "$arch"
            done
          done
          bash scripts/package_macos_dmg.sh "$app" "build/desktop/Mornye-${VERSION}-macos-universal.dmg"
          (cd build/desktop && shasum -a 256 Mornye-*.dmg > SHA256SUMS-macos.txt)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-macos
          if-no-files-found: error
          path: |
            build/desktop/Mornye-*.dmg
            build/desktop/SHA256SUMS-macos.txt

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: get-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            flutter_arch: x64
            runner: ubuntu-22.04
          - arch: aarch64
            deb_arch: arm64
            flutter_arch: arm64
            runner: ubuntu-22.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same build dependencies as desktop.yml, plus the desktop entry and
      # AppStream validators and dpkg-shlibdeps for the deb.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The image's libunwind-14-dev blocks GStreamer's libunwind-dev
          # dependency; asking for it first lets apt replace the LLVM one.
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config zip file \
            libgtk-3-dev liblzma-dev libsecret-1-dev libstdc++-12-dev \
            libjson-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libasound2-dev libclang-dev \
            desktop-file-utils appstream dpkg-dev

      - name: Install rustup
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: bash scripts/build_rust_backend.sh desktop

      - name: Fetch LGPL FFmpeg
        run: bash scripts/fetch_desktop_ffmpeg.sh "linux-${{ matrix.flutter_arch }}"

      - name: Setup Flutter
        if: matrix.flutter_arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      # Flutter publishes no Linux arm64 SDK archive; a clone of the release
      # tag downloads the arm64 Dart SDK and engine on first run.
      - name: Setup Flutter (arm64)
        if: matrix.flutter_arch == 'arm64'
        run: |
          flutter_version="$(jq -r .flutter .fvmrc)"
          git clone --depth 1 --branch "$flutter_version" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ runner.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # linux/CMakeLists.txt installs the Rust library into lib/ and the
      # FFmpeg tools staged above into lib/ffmpeg/.
      - name: Build Linux bundle
        run: |
          flutter build linux --release --target lib/main.dart \
            --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate linux/packaging/com.zarz.mornye.desktop
          appstreamcli validate --no-net --explain linux/packaging/com.zarz.mornye.metainfo.xml ||
            echo "::warning::AppStream metadata has validation issues"

      - name: Package AppImage and deb
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          FLUTTER_ARCH: ${{ matrix.flutter_arch }}
        run: |
          bundle="build/linux/${FLUTTER_ARCH}/release/bundle"
          test -x "$bundle/mornye"
          test -s "$bundle/lib/libmornye_desktop.so"
          test -x "$bundle/lib/ffmpeg/ffmpeg"
          test -x "$bundle/lib/ffmpeg/ffprobe"
          test -s "$bundle/lib/ffmpeg/LICENSE.txt"
          export MORNYE_PACKAGE_ARCH="$ARCH"
          bash scripts/package_linux.sh appimage "$bundle" "$VERSION" \
            "build/desktop/Mornye-${VERSION}-linux-${ARCH}.AppImage"
          bash scripts/package_linux.sh deb "$bundle" "$VERSION" \
            "build/desktop/Mornye-${VERSION}-linux-${DEB_ARCH}.deb"
          dpkg-deb --contents "build/desktop/Mornye-${VERSION}-linux-${DEB_ARCH}.deb" |
            grep -E 'usr/share/applications/com.zarz.mornye.desktop|usr/lib/mornye/mornye$'
          file "build/desktop/Mornye-${VERSION}-linux-${ARCH}.AppImage"
          (cd build/desktop && sha256sum Mornye-* > "SHA256SUMS-linux-${ARCH}.txt")

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/Mornye-*.AppImage
            build/desktop/Mornye-*.deb
            build/desktop/SHA256SUMS-linux-*.txt

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
    needs: get-version
    # The release goes out without Windows assets if this job fails. Remove
    # once a release run of this job is green.
    continue-on-error: true
    outputs:
      signed: ${{ steps.verify-installer.outputs.signed }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ENABLED }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Windows signing configuration
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
          SIGNPATH_CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          if ([string]$env:SIGNPATH_ENABLED -notin '', 'false', 'true') {
            throw 'SIGNPATH_ENABLED must be true or false.'
          }
          if ($env:SIGNPATH_ENABLED -ne 'true') {
            Write-Host '::warning::Windows code signing is disabled. See .github/signpath/README.md.'
            return
          }
          foreach ($name in 'SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
              'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_APP_ARTIFACT_CONFIGURATION',
              'SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION', 'SIGNPATH_CERTIFICATE_THUMBPRINT') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Windows signing setting: $name"
            }
          }
          if ($env:SIGNPATH_SIGNING_POLICY_SLUG -ne 'release-signing') {
            throw 'Public releases require the release-signing policy.'
          }
          if ($env:SIGNPATH_CERTIFICATE_THUMBPRINT.Replace(' ', '') -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'SIGNPATH_CERTIFICATE_THUMBPRINT must identify the issued release certificate.'
          }

      - name: Activate pinned Rust toolchain
        working-directory: rust_backend
        run: rustup show

      - name: Build Rust desktop library
        run: ./scripts/build_rust_backend_windows.ps1 -Target ${{ matrix.rust_target }}

      # Git Bash provides curl, unzip and sha256sum for the fetch script.
      - name: Fetch LGPL FFmpeg
        shell: bash
        run: bash scripts/fetch_desktop_ffmpeg.sh windows-${{ matrix.arch }}

      - name: Setup Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version-file: .fvmrc
          cache: true

      - name: Setup native ARM64 Flutter
        if: matrix.arch == 'arm64'
        run: ./scripts/setup_flutter_windows_arm64.ps1

      - name: Cache pub dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ matrix.arch }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Flutter framework patch
        run: dart scripts/prepare_flutter_sdk.dart

      # windows/CMakeLists.txt installs the Rust library next to mornye.exe
      # and the FFmpeg tools staged above into ffmpeg\.
      - name: Build Windows app
        run: |
          $commit = git rev-parse --short=8 HEAD
          flutter build windows --release --target lib/main.dart --dart-define="GIT_COMMIT=$commit"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bundle = 'build\windows\${{ matrix.arch }}\runner\Release'
          ./scripts/check_windows_bundle.ps1 -BundleDir $bundle -Arch ${{ matrix.arch }}
          "MORNYE_WINDOWS_BUNDLE=$bundle" >> $env:GITHUB_ENV
          $productVersion = (Get-Item "$bundle\mornye.exe").VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion)) { throw 'App ProductVersion is missing' }
          "MORNYE_WINDOWS_APP_VERSION=$productVersion" >> $env:GITHUB_ENV

      - name: Upload unsigned app for signing
        id: unsigned-app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-app-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/windows/${{ matrix.arch }}/runner/Release/

      - name: Sign Mornye app
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.MORNYE_WINDOWS_APP_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/windows-signed

      - name: Use signed app
        if: env.SIGNPATH_ENABLED == 'true'
        env:
          CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          ./scripts/check_windows_signature.ps1 -Path 'build\windows-signed\mornye.exe' -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          ./scripts/check_windows_bundle.ps1 -BundleDir 'build\windows-signed' -Arch ${{ matrix.arch }} -InspectOnly
          "MORNYE_WINDOWS_BUNDLE=build\windows-signed" >> $env:GITHUB_ENV

      - name: Package installer and portable zip
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          ./scripts/package_windows.ps1 -Version $env:VERSION -Arch ${{ matrix.arch }} -BundleDir $env:MORNYE_WINDOWS_BUNDLE
          $installer = Get-Item "build\desktop\Mornye-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          $productVersion = $installer.VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($productVersion)) { throw 'Installer ProductVersion is missing' }
          "MORNYE_WINDOWS_INSTALLER_VERSION=$productVersion" >> $env:GITHUB_ENV

      - name: Upload unsigned installer for signing
        id: unsigned-installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned-installer-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: build/desktop/Mornye-*-setup.exe

      - name: Sign installer
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.MORNYE_WINDOWS_INSTALLER_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: build/windows-signed-installer

      - name: Verify and use signed installer
        id: verify-installer
        if: env.SIGNPATH_ENABLED == 'true'
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          CERTIFICATE_THUMBPRINT: ${{ vars.SIGNPATH_CERTIFICATE_THUMBPRINT }}
        run: |
          $name = "Mornye-$env:VERSION-windows-${{ matrix.arch }}-setup.exe"
          $signed = Join-Path 'build\windows-signed-installer' $name
          ./scripts/check_windows_signature.ps1 -Path $signed -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          Copy-Item -LiteralPath $signed -Destination (Join-Path 'build\desktop' $name) -Force
          'signed=true' >> $env:GITHUB_OUTPUT

      - name: Record checksums
        run: |
          $lines = Get-ChildItem build\desktop -File -Filter 'Mornye-*' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          }
          if (-not $lines) { throw 'No Windows packages were created' }
          [IO.File]::WriteAllText("$PWD\build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt", (($lines -join "`n") + "`n"))
          Get-Content build\desktop\SHA256SUMS-windows-${{ matrix.arch }}.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/desktop/Mornye-*-setup.exe
            build/desktop/Mornye-*-portable.zip
            build/desktop/SHA256SUMS-windows-${{ matrix.arch }}.txt

  # The phone release. Desktop packages are released separately in
  # mornyeapp/Mornye-Desktop by create-desktop-release.
  create-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-android, build-ios]
    if: >-
      ${{ !cancelled()
      && needs.build-android.result == 'success'
      && needs.build-ios.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Generate changelog with git-cliff
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Show generated changelog
        run: |
          echo "Generated changelog:"
          cat /tmp/changelog.txt

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: ./release

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ./release

      # The Android job's checksums are verified, then one SHA256SUMS.txt
      # covering every asset replaces them.
      - name: Verify downloaded artifacts and write SHA256SUMS.txt
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          rm -f SHA256SUMS.txt
          sha256sum Mornye-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          CURRENT_REF=$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          # Start with git-cliff changelog, but replace its compare footer with a
          # deterministic previous-tag lookup from git.
          sed '/^## [0-9][0-9.[:alpha:]-]*$/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.txt > /tmp/release_body.txt

          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/%s/compare/%s...%s)\n' \
              "$PREVIOUS_TAG" "$VERSION" "$REPO_OWNER" "$REPO_NAME" "$PREVIOUS_TAG" "$VERSION" \
              >> /tmp/release_body.txt
          fi

          cat >> /tmp/release_body.txt << FOOTER

          ---

          ### Downloads

          #### Android
          - **arm64**: \`Mornye-${VERSION}-arm64.apk\` (recommended for modern devices)
          - **arm32**: \`Mornye-${VERSION}-arm32.apk\` (older devices)
          - \`*.apk.idsig\`: V4 signatures for \`adb install --incremental\` only; normal installs do not need them

          #### iOS
          - **iOS**: \`Mornye-${VERSION}-ios-unsigned.ipa\` (sideload required)

          \`SHA256SUMS.txt\` lists the SHA-256 of every file above.

          ### Installation
          **Android**: Enable "Install from unknown sources" and install the APK
          **iOS**: Use AltStore, Sideloadly, or similar tools to sideload the IPA
          FOOTER

          echo "Release body:"
          cat /tmp/release_body.txt

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Mornye ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: ./release/*
          draft: false
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Desktop packages are released in mornyeapp/Mornye-Desktop, where the
  # desktop updater looks. Releases stay drafts until the repository variable
  # DESKTOP_RELEASES_PUBLIC is 'true', so nothing ships before testing ends.
  create-desktop-release:
    runs-on: ubuntu-latest
    needs: [get-version, build-macos, build-linux, build-windows]
    # build-windows may fail without blocking the release (continue-on-error).
    if: >-
      ${{ !cancelled()
      && needs.build-macos.result == 'success'
      && needs.build-linux.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for git-cliff

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/changelog.txt

      - name: Download desktop packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: ./release

      # Each build job's checksums are verified, then one SHA256SUMS.txt
      # covering every asset replaces them. The desktop updater reads it.
      - name: Verify downloaded artifacts and write SHA256SUMS.txt
        run: |
          cd release
          for sums in SHA256SUMS-*.txt; do
            sha256sum --check "$sums"
          done
          rm -f SHA256SUMS-*.txt
          sha256sum Mornye-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release body
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          WINDOWS_SIGNED: ${{ needs.build-windows.outputs.signed }}
        run: |
          CURRENT_REF=$(git rev-list -n 1 "$VERSION" 2>/dev/null || git rev-parse HEAD)
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_REF}^" 2>/dev/null || true)

          sed '/^## [0-9][0-9.[:alpha:]-]*$/d; /^\*\*Full Changelog\*\*/d' /tmp/changelog.txt > /tmp/release_body.txt

          # The source and its history live in the main repository.
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n**Full Changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' \
              "$PREVIOUS_TAG" "$VERSION" "$REPOSITORY" "$PREVIOUS_TAG" "$VERSION" \
              >> /tmp/release_body.txt
          fi

          cat >> /tmp/release_body.txt << FOOTER

          Built from [${REPOSITORY}@${VERSION}](https://github.com/${REPOSITORY}/tree/${VERSION}).

          ---

          ### Downloads
          | OS | Download | Notes |
          |---|---|---|
          FOOTER

          # Rows list only the packages this run produced (Windows is
          # optional until its job is proven).
          desktop_row() {
            if [ -f "release/$2" ]; then
              printf "| %s | \`%s\` | %s |\n" "$1" "$2" "$3" >> /tmp/release_body.txt
            fi
          }
          desktop_row "macOS" "Mornye-${VERSION}-macos-universal.dmg" "Apple silicon and Intel, macOS 12 or later"
          desktop_row "Windows" "Mornye-${VERSION}-windows-x64-setup.exe" "Installer (x64), no administrator rights needed"
          desktop_row "Windows" "Mornye-${VERSION}-windows-x64-portable.zip" "Portable (x64): extract and run mornye.exe"
          desktop_row "Windows" "Mornye-${VERSION}-windows-arm64-setup.exe" "Installer (ARM64), no administrator rights needed"
          desktop_row "Windows" "Mornye-${VERSION}-windows-arm64-portable.zip" "Portable (ARM64): extract and run mornye.exe"
          desktop_row "Linux" "Mornye-${VERSION}-linux-x86_64.AppImage" "AppImage (x86_64), updates itself"
          desktop_row "Linux" "Mornye-${VERSION}-linux-aarch64.AppImage" "AppImage (aarch64), updates itself"
          desktop_row "Linux" "Mornye-${VERSION}-linux-amd64.deb" "Debian/Ubuntu (amd64)"
          desktop_row "Linux" "Mornye-${VERSION}-linux-arm64.deb" "Debian/Ubuntu (arm64)"

          cat >> /tmp/release_body.txt << FOOTER

          \`SHA256SUMS.txt\` lists the SHA-256 of every file above.

          ### Installation
          **macOS**: Open the dmg and drag Mornye to Applications. Mornye is not notarized yet, so macOS blocks the first launch: open System Settings > Privacy & Security, scroll to Security and click "Open Anyway" next to the Mornye message, then confirm with "Open". Later updates open the new dmg for you.
          **Windows**: Run the setup, or extract the portable ZIP and run \`mornye.exe\`.
          [Code signing policy](https://github.com/${REPOSITORY}/blob/${VERSION}/.github/signpath/README.md#code-signing-policy).
          **Linux**: AppImage: \`chmod +x\` the file and run it. deb: \`sudo apt install ./Mornye-${VERSION}-linux-amd64.deb\` (or the arm64 file); deb installs update through new releases.
          FOOTER

          if [ "$WINDOWS_SIGNED" = 'true' ]; then
            printf '\nWindows installers and mornye.exe have verified, timestamped SignPath signatures. SmartScreen may still display a reputation warning.\n' >> /tmp/release_body.txt
          elif compgen -G 'release/Mornye-*-windows-*-setup.exe' > /dev/null; then
            printf '\nWindows packages in this release are unsigned.\n' >> /tmp/release_body.txt
          fi

          echo "Release body:"
          cat /tmp/release_body.txt

      - name: Create desktop release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: mornyeapp/Mornye-Desktop
          token: ${{ secrets.MORNYE_DESKTOP_RELEASE_TOKEN }}
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Mornye ${{ needs.get-version.outputs.version }}
          body_path: /tmp/release_body.txt
          files: ./release/*
          draft: ${{ vars.DESKTOP_RELEASES_PUBLIC != 'true' }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}

  update-altstore:
    runs-on: ubuntu-latest
    needs: [get-version, build-ios, create-release]
    # !cancelled() keeps an optional build-windows failure upstream of
    # create-release from skipping this job.
    if: ${{ !cancelled() && needs.create-release.result == 'success' && needs.get-version.outputs.is_prerelease != 'true' }}
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ./release

      - name: Update apps.json
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION_NUM="${VERSION#v}"
          DATE=$(date -u +%Y-%m-%d)
          IPA_FILE=$(find ./release -name "*ios*.ipa" | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "WARNING: IPA file not found, skipping apps.json update"
            exit 0
          fi

          IPA_SIZE=$(stat -c%s "$IPA_FILE" 2>/dev/null || stat -f%z "$IPA_FILE")
          BUNDLE_ID=$(python3 - "$IPA_FILE" <<'PY'
          import plistlib
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as ipa:
              info_path = next(name for name in ipa.namelist()
                               if name.startswith("Payload/")
                               and name.count("/") == 2
                               and name.endswith(".app/Info.plist"))
              print(plistlib.loads(ipa.read(info_path))["CFBundleIdentifier"])
          PY
          )

          if [ ! -f apps.json ]; then
            echo "WARNING: apps.json not found on main, skipping"
            exit 0
          fi

          jq --arg ver "$VERSION_NUM" \
             --arg bundle "$BUNDLE_ID" \
             --arg date "$DATE" \
             --arg url "https://github.com/${REPOSITORY}/releases/download/${VERSION}/Mornye-${VERSION}-ios-unsigned.ipa" \
             --argjson size "$IPA_SIZE" \
             '.apps[0].bundleIdentifier = $bundle | .apps[0].version = $ver | .apps[0].versionDate = $date | .apps[0].downloadURL = $url | .apps[0].size = $size' \
             apps.json > apps.json.tmp && mv apps.json.tmp apps.json

          echo "Updated apps.json:"
          cat apps.json

      - name: Commit and push
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update AltStore source to ${VERSION}"
            git push
          fi

  notify-telegram:
    runs-on: ubuntu-latest
    needs: [get-version, create-release]
    if: ${{ !cancelled() && needs.create-release.result == 'success' && needs.get-version.outputs.is_prerelease != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: ./release

      - name: Download iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: ./release

      - name: Generate changelog with git-cliff for Telegram
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT: /tmp/cliff_tg.txt

      - name: Convert changelog for Telegram
        id: changelog
        run: |
          if [ ! -s /tmp/cliff_tg.txt ]; then
            echo "See release notes on GitHub for details." > /tmp/changelog.txt
          else
            # Convert Markdown to Telegram HTML
            CHANGELOG=$(cat /tmp/cliff_tg.txt | \
              sed '/^## [0-9][0-9.[:alpha:]-]*$/d' | \
              sed '/^\*\*Full Changelog\*\*/d' | \
              sed 's/ by \[@[^]]*\](https:\/\/github\.com\/[^)]*)//g' | \
              sed 's/ by @[A-Za-z0-9_-]\+//g' | \
              sed 's/\[#\([0-9]*\)\]([^)]*)/#\1/g' | \
              sed 's/\[@\([^]]*\)\]([^)]*)/@\1/g' | \
              sed 's/&/\&amp;/g' | \
              sed 's/</\&lt;/g' | \
              sed 's/>/\&gt;/g' | \
              sed 's/\*\*\([^*]*\)\*\*/<b>\1<\/b>/g' | \
              sed 's/^### \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^## \(.*\)$/<b>\1<\/b>/g' | \
              sed 's/^- /• /g')

            # Truncate for Telegram 4096 char limit
            CHANGELOG=$(echo "$CHANGELOG" | head -c 2500 | sed '$d')
            echo "$CHANGELOG" > /tmp/changelog.txt
          fi

          echo "Telegram changelog:"
          cat /tmp/changelog.txt

      - name: Send to Telegram Channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: '@mornyeupdates'
          VERSION: ${{ needs.get-version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CHANGELOG=$(cat /tmp/changelog.txt)

          ARM64_APK=$(find ./release -name "*arm64*.apk" | head -1)
          ARM32_APK=$(find ./release -name "*arm32*.apk" | head -1)

          # Prepare message with changelog (HTML format)
          printf '%s\n' \
            "<b>Mornye ${VERSION} Released!</b>" \
            "" \
            "<b>What's New:</b>" \
            "${CHANGELOG}" \
            "" \
            "<a href=\"https://github.com/${REPOSITORY}/releases/tag/${VERSION}\">View Release Notes</a>" \
            > /tmp/telegram_message.txt

          MESSAGE=$(cat /tmp/telegram_message.txt)

          # Send message first (using HTML parse mode)
          # Use --data-urlencode for proper encoding of special chars (+, &, etc.)
          # Use || true to ensure file uploads continue even if message fails
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" || true

          if [ -f "$ARM64_APK" ]; then
            echo "Uploading arm64 APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM64_APK}" \
              -F caption="Mornye ${VERSION} - arm64 (recommended)"
          fi

          if [ -f "$ARM32_APK" ]; then
            echo "Uploading arm32 APK to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${ARM32_APK}" \
              -F caption="Mornye ${VERSION} - arm32"
          fi

          IOS_IPA=$(find ./release -name "*ios*.ipa" | head -1)
          if [ -f "$IOS_IPA" ]; then
            echo "Uploading iOS IPA to Telegram..."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F document=@"${IOS_IPA}" \
              -F caption="Mornye ${VERSION} - iOS (unsigned, sideload required)"
          fi

          echo "Telegram notification sent!"
