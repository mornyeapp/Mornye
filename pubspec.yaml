name: mornye
description: Mornye, extension-driven music metadata and downloads for mobile devices
publish_to: "none"
version: 5.3.0+166

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  timezone: ^0.11.2

  # State Management
  flutter_riverpod: ^3.4.2

  # Navigation
  go_router: ^18.1.1

# Storage & Persistence
  shared_preferences: ^2.5.6
  # v11 removes legacy Android readers, breaking users who skip the v10 migration.
  # Keep the compatibility release until old encrypted installs can be migrated.
  flutter_secure_storage: 10.3.4
  mornye_discord:
    path: third_party/mornye_discord
  path_provider: ^2.1.6
  # Windows known-folder lookup for the default desktop Music folder.
  path_provider_windows: ^2.3.0
  path: ^1.9.1
  # Desktop backend library bindings (lib/services/backend).
  ffi: ^2.2.0
  sqflite: ^2.4.5
  # Windows and Linux have no sqflite plugin; they use FFI with bundled SQLite.
  sqflite_common_ffi: ^2.4.5

# HTTP & Network
  http: ^1.6.0
  # 7.3.2 requires dbus 0.8, while desktop_drop 0.8.4 still requires 0.7.
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  # Mornye Link: finds the desktop app on the local network (mDNS).
  bonsoir: ^7.1.5

  # Streaming backup archives
  archive: ^4.5.2

  # UI Components
  cached_network_image: ^4.0.5
  flutter_cache_manager: ^3.4.5
  liquid_glass_easy: 5.0.0
  cupertino_icons: ^2.0.0
  material_symbols_icons: ^4.2960.0
  volume_controller: ^3.7.1

  # Material Expressive 3 / Dynamic Color
  dynamic_color: ^2.1.0
  material_ui: ^1.8.0
  material_3_expressive: ^1.2.0
  material_color_utilities: 0.13.0

  # Permissions
  permission_handler: ^13.0.1

  # File Picker
  file_picker: ^13.1.0
  # Desktop: drop music files and folders onto the window to add them.
  # Pinned below 0.9, which moves to cross_file 0.4 (the tree resolves 0.3).
  desktop_drop: 0.8.4

  # JSON Serialization
  json_annotation: ^4.12.0

  # Utils
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  share_plus: ^13.3.1
  receive_sharing_intent: ^1.9.0
  logger: ^2.7.0

  # FFmpeg for audio conversion
  ffmpeg_kit_flutter_new_audio: 2.5.7
  open_filex: ^5.0.0

  video_player: ^2.14.1

  xml: ^7.1.0
  html: ^0.15.7
  dart_smb2: 0.1.3
  synchronized: ^3.5.0

  # Notifications
  flutter_local_notifications: ^22.3.2
  audioplayers: ^6.8.1
  audio_service:
    path: third_party/audio_service
  audio_session: ^0.2.4
  app_links: ^7.2.2
  # Windows and Linux playback (libmpv). Android, iOS and macOS keep
  # audioplayers; macOS bundles libmpv only for exclusive output (hog mode),
  # which AVPlayer cannot play through.
  media_kit: ^1.2.6
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_audio: ^1.1.4
  # Desktop media sessions behind audio_service: MPRIS on Linux (D-Bus) and
  # the System Media Transport Controls on Windows.
  audio_service_platform_interface: ^0.1.3
  dbus: ^0.7.15
  smtc_windows: ^1.1.0

dependency_overrides:
  # Retain the existing Apple keychain fixes while Android uses legacy migration.
  # The v10 and v11 Apple option maps use the same platform interface contract.
  flutter_secure_storage_darwin: 0.4.3
  # Per-player audio processing tap; upstream playback and session ownership stay intact.
  audioplayers_darwin:
    path: third_party/audioplayers_darwin
  # Preserve Android proxy descriptors supplied by network document providers.
  audioplayers_android:
    path: third_party/audioplayers_android
  # smtc_windows 1.1.0 is generated by and links flutter_rust_bridge =2.11.1,
  # but allows any 2.x runtime; a newer one fails its version check at start
  # and leaves Windows without media transport controls.
  flutter_rust_bridge: 2.11.1
  # Builds the Linux plugin without its native bundle where upstream has
  # none (arm64); desktop runs the bundled ffmpeg CLI instead.
  ffmpeg_kit_flutter_new_audio:
    path: third_party/ffmpeg_kit_flutter_new_audio
  # Upstream bundles x64 only; keep native playback on Windows ARM64.
  media_kit_libs_windows_audio:
    path: third_party/media_kit_libs_windows_audio

hooks:
  user_defines:
    sqlite3:
      # Only Windows and Linux open databases through sqflite_common_ffi.
      # Mobile and macOS keep the sqflite plugins, so they bundle no copy.
      source:
        android: system
        ios: system
        macos: system
        default: sqlite3

dev_dependencies:
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  clock: 1.1.3
  analyzer: ^14.6.0
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  riverpod_lint: ^3.1.9
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: 2.1.3
  video_player_platform_interface: 6.9.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#1E4E4F"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "icon_monochrome_android.png"
  ios_content_mode: scaleAspectFill
  remove_alpha_ios: true
  background_color_ios: "#1E4E4F"
  # The macOS source places the badge on Apple's 824 pt icon grid.
  macos:
    generate: true
    image_path: "icon_macos.png"
  windows:
    generate: true
    image_path: "assets/brand/logo/png/mornye-badge@1x.png"
    icon_size: 256

flutter:
  uses-material-design: true
  generate: true

  shaders:
    - assets/shaders/mornye_selection_mask.frag

  assets:
    - LICENSE
    - COPYING
    - NOTICE
    - assets/images/
    - assets/fonts/Inter-LICENSE.txt
    - assets/fonts/GoogleSansFlex-LICENSE.txt
    - assets/licenses/usb.txt
    - assets/licenses/oboe.txt
    - assets/licenses/wavpack.txt
    - assets/licenses/flac.txt
    - assets/licenses/ffmpeg.txt
    - assets/licenses/lgpl-3.0.txt
    - assets/licenses/libsmb2.txt
    - assets/licenses/native_palette.txt
    - assets/licenses/native_data_jobs.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
