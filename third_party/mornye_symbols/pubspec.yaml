name: mornye_symbols
description: Pre-instanced subset of Material Symbols Rounded used by Mornye.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.10.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: MornyeSymbolsRounded
      fonts:
        - asset: fonts/MornyeSymbolsRounded.ttf
