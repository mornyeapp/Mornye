name: ffmpeg_kit_flutter_new_audio
description: FFmpeg Kit Audio for Flutter. Mornye uses native plugins on Android and iOS, and bundled ffmpeg/ffprobe CLI with Dart helpers on desktop.
repository: https://github.com/sk3llo/ffmpeg_kit_flutter/tree/audio
homepage: https://github.com/sk3llo/ffmpeg_kit_flutter
version: 3.0.0
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.antonkarpenko.ffmpegkit
        pluginClass: FFmpegKitFlutterPlugin
      ios:
        pluginClass: FFmpegKitFlutterPlugin

dependencies:
  ffmpeg_kit_flutter_platform_interface: ^0.2.1

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
