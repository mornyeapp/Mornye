name: ffmpeg_kit_flutter_new_audio
description: FFmpeg Kit Audio for Flutter. Mornye uses native plugins on Android, iOS, macOS and Linux, and Dart helpers on Windows.
repository: https://github.com/sk3llo/ffmpeg_kit_flutter/tree/audio
homepage: https://github.com/sk3llo/ffmpeg_kit_flutter
version: 2.5.7
environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.0.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.antonkarpenko.ffmpegkit
        pluginClass: FFmpegKitFlutterPlugin
      ios:
        pluginClass: FFmpegKitFlutterPlugin
      macos:
        pluginClass: FFmpegKitFlutterPlugin
      linux:
        pluginClass: FFmpegKitFlutterPlugin

dependencies:
  ffmpeg_kit_flutter_platform_interface: ^0.2.1

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
