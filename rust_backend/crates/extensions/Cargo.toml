[package]
name = "mornye-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mornye-core.workspace = true
mornye-network.workspace = true
mornye-providers.workspace = true
rquickjs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
aes.workspace = true
blowfish.workspace = true
zeroize.workspace = true
getrandom.workspace = true
tempfile.workspace = true
zip.workspace = true
regex.workspace = true
time.workspace = true
chrono.workspace = true
httpdate.workspace = true
cap-std.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# rquickjs-sys ships bindings for x86_64 and aarch64 Windows MSVC, so Windows
# builds need no libclang. Android and iOS still generate theirs.
[target.'cfg(not(windows))'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }
winx = "=0.36.4"

[dev-dependencies]
image.workspace = true
libc.workspace = true
rustls.workspace = true
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

[lints]
workspace = true
